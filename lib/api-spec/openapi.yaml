openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /assets/products/{bag}/{frame}:
    get:
      operationId: getProductFrame
      summary: Serve a public product turntable frame
      servers:
        - url: /
      parameters:
        - name: bag
          in: path
          required: true
          schema:
            type: string
            enum: [the-sloane, the-solenne, the-marais, the-no-8, the-alba, the-liora]
        - name: frame
          in: path
          required: true
          schema:
            type: string
            pattern: '^(0[1-9]|1[0-9]|2[0-4])\.jpg$'
      responses:
        "200":
          description: Product turntable JPEG
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "404":
          description: Frame not found
        "503":
          description: Asset storage temporarily unavailable
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products in the ROSE storefront
      responses:
        "200":
          description: Active storefront products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreProductList"
        "503":
          description: Product catalog temporarily unavailable
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StoreProduct:
      type: object
      properties:
        id:
          type: integer
          format: int64
        slug:
          type: string
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: double
        image:
          type: string
        category:
          type: string
        turntableSlug:
          type: string
        sortOrder:
          type: integer
      required:
        - id
        - slug
        - name
        - description
        - price
        - image
        - category
        - turntableSlug
        - sortOrder
    StoreProductList:
      type: array
      items:
        $ref: "#/components/schemas/StoreProduct"

