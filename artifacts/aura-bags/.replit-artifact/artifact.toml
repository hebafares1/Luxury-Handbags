kind = "web"
previewPath = "/"
title = "ROSE Handbags"
description = "A luxury women’s handbag storefront for the ROSE brand, featuring a curated bag collection, interactive 360° product viewer, favorites, and a shopping cart."
version = "1.0.0"
id = "artifacts/aura-bags"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21603

[services.development]
run = "pnpm --filter @workspace/aura-bags run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/aura-bags", "run", "build" ]
serve = "static"
publicDir = "artifacts/aura-bags/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21603"
BASE_PATH = "/"
